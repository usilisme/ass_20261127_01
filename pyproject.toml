[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "auto-driving"
version = "1.0.0"
description = "Command-line simulation of autonomous cars on a rectangular field."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
auto-driving = "auto_driving.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_driving"]

# ---- pytest -------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=auto_driving --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
branch = true
source = ["auto_driving"]
# __main__ is exercised through a subprocess, which coverage does not follow.
omit = ["*/auto_driving/__main__.py"]

# ---- ruff ---------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT"]

# ---- mypy ---------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
